services:
  grafana:
    image: grafana/grafana:12.4.11
    container_name: f1_garage_grafana
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in grafana/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in grafana/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-host.docker.internal:1433}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME:-f1_garage_tec}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:?Set a read-only SQL login in grafana/.env}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in grafana/.env}
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    networks:
      - f1-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  f1-network:
    driver: bridge
